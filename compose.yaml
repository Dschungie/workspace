services:
  workspace:
    build: .
    image: nessha-workspace:0.1.0
    container_name: nessha-workspace
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      # The existing TLS-protected Living API is the narrow trust boundary.
      # Workspace has no database or filesystem access to Living.
      LIVING_AUTH_EXCHANGE_URL: ${LIVING_AUTH_EXCHANGE_URL:-https://www.nessha.vn/api/workspace-auth/exchange}
      WORKSPACE_AUTH_EXCHANGE_SECRET: ${WORKSPACE_AUTH_EXCHANGE_SECRET:?set in the server-only environment}
    ports:
      - "127.0.0.1:3105:3000"
    volumes:
      - workspace_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  workspace_data:
    name: nessha_workspace_data
